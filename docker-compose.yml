# Local development. Supabase (Postgres, Auth, Storage) runs from the Supabase CLI:
#
#   supabase start
#   docker compose up --build
#
#   web       http://localhost:3000
#   api       http://localhost:8000  (docs at /docs)
#   supabase  http://localhost:54323 (Studio), emails caught at http://localhost:54324
#
# Supabase keys come from `.env` in the repo root; see `.env.example`.

name: engram

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    ENGRAM_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    ENGRAM_SUPABASE_URL: http://host.docker.internal:54321
    ENGRAM_SUPABASE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
    ENGRAM_WEB_URL: http://localhost:3000
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./backend/src:/app/src

services:
  api:
    <<: *backend
    command: uvicorn engram.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: python -m engram.worker.main

  web:
    build: ./web
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
    depends_on:
      - api
