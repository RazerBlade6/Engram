name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Generate a throwaway JWT signing key
        run: echo '[]' > supabase/signing_keys.json && supabase gen signing-key --algorithm ES256 --append
      - name: Start Supabase Postgres and apply migrations
        run: supabase db start
      - name: Lint the schema
        run: supabase db lint --level warning --fail-on warning
      - name: Row-level security tests
        run: supabase test db
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - working-directory: backend
        run: uv sync --locked
      - working-directory: backend
        run: uv run ruff format --check .
      - working-directory: backend
        run: uv run ruff check .
      - working-directory: backend
        run: uv run mypy
      - working-directory: backend
        env:
          ENGRAM_REQUIRE_DB: "1"
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
