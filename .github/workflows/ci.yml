name: CI

# Every change is tested once, on its push to dev. A pull request from dev into main merges
# the commit that push already tested (its checks show on the pull request), so only pull
# requests from other branches run here. main itself never runs CI.
on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name == 'push' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Generate a throwaway JWT signing key
        run: echo '[]' > supabase/signing_keys.json && supabase gen signing-key --algorithm ES256 --append
      - name: Start Supabase Postgres and apply migrations
        run: supabase db start
      - name: Lint the schema
        run: supabase db lint --level warning --fail-on warning
      - name: Row-level security tests
        run: supabase test db
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Cache Docling and embedding models
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: models-${{ hashFiles('backend/uv.lock') }}
          restore-keys: models-
      - working-directory: backend
        run: uv sync --locked --all-extras
      - working-directory: backend
        run: uv run ruff format --check .
      - working-directory: backend
        run: uv run ruff check .
      - working-directory: backend
        run: uv run mypy
      - working-directory: backend
        env:
          ENGRAM_REQUIRE_DB: "1"
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: uv run pytest

  web:
    if: github.event_name == 'push' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
